name: Daily digest

on:
  # 원래 여기 GitHub 기본 schedule 트리거가 있었는데, 몇 시간~하루 단위로 지연되는 문제가 있어서 제거함.
  # 대신 web/vercel.json의 Vercel Cron이 /api/trigger-digest를 매일 21:30 UTC(06:30 KST)에 호출해서
  # 아래 workflow_dispatch로 이 워크플로를 트리거함.
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능

jobs:
  run-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect RSS content
        run: npm run ingest:rss
        continue-on-error: true # 수집 단계가 실패해도 이미 쌓인 콘텐츠로 매칭/발송은 계속 진행

      - name: Prune stale unused news
        run: npm run prune:news
        continue-on-error: true # 정리 실패로 발송 자체가 막히면 안 됨

      - name: Build today's issue
        run: npm run build:issue

      - name: Send digest emails
        run: npm run send:digest
