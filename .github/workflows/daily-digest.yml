name: Daily digest

on:
  # GitHub 기본 schedule 트리거는 몇 시간~하루 단위로 지연되는 문제가 있어서 뺐음.
  # 대신 web/vercel.json의 Vercel Cron이 매일 21:30 UTC(06:30 KST)에 /api/trigger-digest를
  # 호출해서 아래 workflow_dispatch로 이 워크플로를 트리거함 — Vercel 대시보드에서 Cron Job
  # 등록(Enabled)과 CRON_SECRET/DIGEST_TRIGGER_TOKEN 환경변수(Production) 둘 다 실제로
  # 확인 완료. schedule을 다시 켜면 같은 시간대에 두 트리거가 겹쳐서 콘텐츠 큐가 동시에
  # 소진될 위험이 있으니, 문제가 재발할 때만 임시로 복원할 것.
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능, Vercel Cron도 이걸 호출함

jobs:
  run-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect RSS content
        run: npm run ingest:rss
        continue-on-error: true # 수집 단계가 실패해도 이미 쌓인 콘텐츠로 매칭/발송은 계속 진행

      - name: Prune stale unused news
        run: npm run prune:news
        continue-on-error: true # 정리 실패로 발송 자체가 막히면 안 됨

      - name: Build today's issue
        run: npm run build:issue

      - name: Send digest emails
        run: npm run send:digest
