name: Daily digest

on:
  schedule:
    # 매주 월~금 06:30 KST = UTC 전날 21:30 (UTC 기준 요일이 하루 당겨지므로 0-4=일~목)
    # web/vercel.json의 Vercel Cron이 같은 시각에 /api/trigger-digest -> workflow_dispatch로도
    # 이 워크플로를 트리거하도록 준비돼 있고, Cron Job 등록(Enabled)과 CRON_SECRET/
    # DIGEST_TRIGGER_TOKEN 환경변수(Production)도 실제로 존재하는 것까지 확인했지만,
    # Vercel 대시보드의 수동 "Run" 버튼으로 테스트했을 때 /api/trigger-digest가 401을
    # 반환하는 걸 봐서 실제 크론 호출도 인증에 걸릴지 100% 확신이 안 섬(수동 버튼이 자동
    # 크론과 다른 헤더로 호출하는 것뿐일 수도 있음). 확신 서기 전까지는 schedule을 안전망으로
    # 켜둠 — build:issue가 이미 발송된 회차는 건너뛰니 이중 발동돼도 큰 문제는 없음.
    # 내일 GitHub Actions 로그에 06:30~07:30 KST 사이 workflow_dispatch로 트리거된 실행이
    # 따로 뜨면 Vercel 경로가 정상 작동하는 거니, 그때 이 schedule을 다시 빼면 됨.
    - cron: '30 21 * * 0-4'
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능, Vercel Cron도 이걸 호출함

jobs:
  run-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect RSS content
        run: npm run ingest:rss
        continue-on-error: true # 수집 단계가 실패해도 이미 쌓인 콘텐츠로 매칭/발송은 계속 진행

      - name: Prune stale unused news
        run: npm run prune:news
        continue-on-error: true # 정리 실패로 발송 자체가 막히면 안 됨

      - name: Build today's issue
        run: npm run build:issue

      - name: Send digest emails
        run: npm run send:digest
