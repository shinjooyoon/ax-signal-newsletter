name: Daily digest

on:
  # 진짜 원인 찾음: CRON_SECRET/DIGEST_TRIGGER_TOKEN 환경변수를 Vercel에 추가만 하고
  # 재배포를 안 해서, 실제 배포본에는 그 값들이 반영이 안 돼 /api/trigger-digest가 항상
  # 401을 반환하고 있었음(그래서 Vercel Cron이 매일 호출은 했어도 계속 인증 실패로 끝남).
  # CRON_SECRET을 재발급하고 재배포한 뒤 새 값으로 직접 호출해서 200 성공 확인함 —
  # web/vercel.json의 Vercel Cron이 매일 21:30 UTC(06:30 KST)에 이 워크플로를
  # workflow_dispatch로 정상 트리거하는 것까지 검증됐으니 GitHub 자체 schedule은 뺌
  # (같은 시간대에 두 트리거가 겹치는 걸 피하려는 목적, build:issue의 멱등성 덕에 켜둬도
  # 위험하진 않았지만 이제 필요 없음).
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능, Vercel Cron도 이걸 호출함

jobs:
  run-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect RSS content
        run: npm run ingest:rss
        continue-on-error: true # 수집 단계가 실패해도 이미 쌓인 콘텐츠로 매칭/발송은 계속 진행

      - name: Prune stale unused news
        run: npm run prune:news
        continue-on-error: true # 정리 실패로 발송 자체가 막히면 안 됨

      - name: Build today's issue
        run: npm run build:issue

      - name: Send digest emails
        run: npm run send:digest
