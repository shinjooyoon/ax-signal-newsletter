name: Daily digest

on:
  schedule:
    # 매주 월~금 06:30 KST 목표 = UTC 전날 21:30 (UTC 기준 요일이 하루 당겨지므로 0-4=일~목).
    # 실제로는 그보다 늦게 도는데, 아래 조사 결과에 따라 :30(정각/반각) 같은 혼잡한
    # 분 대신 :47로 미뤄서 GitHub 큐 지연을 조금이라도 줄여봄.
    #
    # 히스토리: CRON_SECRET 환경변수가 재배포 없이는 반영 안 되던 버그를 찾아 고침
    # (2026-08-28~09-05). 그 후로도 매일 아침 "발송 안 됨"이 반복돼서 GitHub Actions
    # 실행 기록(웹 UI)을 날짜별로 직접 까본 결과(2026-09-13):
    #   - Vercel Cron → workflow_dispatch 경로("Manually run by shinjooyoon"으로 표시)는
    #     9/8~9/11 나흘 연속 KST 07:13:26에 초 단위까지 정확히 발동함. Vercel Hobby의
    #     "1시간 이내 best-effort"가 실제로는 이 프로젝트 기준 고정 오프셋(목표+43분)으로
    #     동작하는 것으로 보임. 즉 Vercel Cron은 실제로는 안 끊기고 계속 잘 돌고 있었음.
    #   - 다만 그동안 이 자동 트리거가 도착하기도 전에(07:00~07:13 사이) 사람이 매번
    #     먼저 수동으로 돌려버려서, 자동 발송이 "진짜 작동하는지"를 한 번도 방해받지
    #     않은 채로 검증한 적이 없었음. → 그래서 vercel.json의 cron을 20:47 UTC(=05:47
    #     KST)로 43분 앞당겨서, 관측된 지연을 보정하면 실제 발송이 06:30 KST 근처에
    #     오도록 조정함.
    #   - GitHub 자체 schedule(이 트리거)은 같은 기간 08:20~08:42 KST 사이로 매번
    #     들쭉날쭉하게 늦게 돎(목표 대비 1시간51분~2시간12분) — GitHub 공식 문서가
    #     명시하는 "고부하 시간대엔 수 시간 지연 가능" 그대로. 정밀 타이밍은 포기하고
    #     Vercel 경로가 통째로 실패했을 때만 뒤늦게라도 채워주는 최후 안전망 역할로만
    #     유지. build:issue/send:digest가 이미 발송된 회차를 건너뛰므로 두 트리거가
    #     겹쳐 발동돼도 문제없음(중복 발송 없음).
    - cron: '47 21 * * 0-4'
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능, Vercel Cron도 이걸 호출함

jobs:
  run-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect RSS content
        run: npm run ingest:rss
        continue-on-error: true # 수집 단계가 실패해도 이미 쌓인 콘텐츠로 매칭/발송은 계속 진행

      - name: Prune stale unused news
        run: npm run prune:news
        continue-on-error: true # 정리 실패로 발송 자체가 막히면 안 됨

      - name: Build today's issue
        run: npm run build:issue

      - name: Send digest emails
        run: npm run send:digest
