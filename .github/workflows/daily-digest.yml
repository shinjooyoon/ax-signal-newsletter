name: Daily digest

on:
  schedule:
    # 매주 월~금 06:30 KST = UTC 전날 21:30 (UTC 기준 요일이 하루 당겨지므로 0-4=일~목)
    #
    # 히스토리: CRON_SECRET 환경변수가 재배포 없이는 반영 안 되던 버그를 찾아 고치고
    # (2026-08-28~09-05), 수동 curl로 /api/trigger-digest가 200을 반환하는 것까지
    # 확인해서 한 번은 이 schedule을 뺐었음. 근데 그 다음 첫 평일(09-07, 월)에 Vercel
    # Cron이 정말로 아예 호출을 안 해서(실행 기록 자체가 없음, 401도 아니고 완전 무反応)
    # 이번엔 원인이 인증이 아니라 Vercel Cron 자체의 best-effort 배달 누락으로 보임
    # (Vercel 공식 문서도 "cron delivery is best effort, occasional misses happen"라고
    # 명시함). 그래서 Vercel Cron을 신뢰할 수 없다고 판단, 이 schedule을 "확인되면 뺄
    # 임시 안전망"이 아니라 영구적인 이중화 장치로 유지하기로 함. build:issue가 이미
    # 발송된 회차는 건너뛰므로 Vercel/GitHub 둘 다 겹쳐 발동돼도 문제없음.
    - cron: '30 21 * * 0-4'
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능, Vercel Cron도 이걸 호출함

jobs:
  run-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect RSS content
        run: npm run ingest:rss
        continue-on-error: true # 수집 단계가 실패해도 이미 쌓인 콘텐츠로 매칭/발송은 계속 진행

      - name: Prune stale unused news
        run: npm run prune:news
        continue-on-error: true # 정리 실패로 발송 자체가 막히면 안 됨

      - name: Build today's issue
        run: npm run build:issue

      - name: Send digest emails
        run: npm run send:digest
