name: Daily digest

on:
  schedule:
    # 매주 월~금 06:30 KST = UTC 전날 21:30 (UTC 기준 요일이 하루 당겨지므로 0-4=일~목)
    # web/vercel.json의 Vercel Cron이 같은 시각에 /api/trigger-digest를 통해 이 워크플로를
    # workflow_dispatch로도 트리거하도록 준비돼 있었는데, Vercel 쪽 Cron Job 등록과
    # CRON_SECRET/DIGEST_TRIGGER_TOKEN 환경변수가 아직 실제로 설정 안 돼 있어서(확인함)
    # 지금은 이 schedule이 유일한 트리거임 — 지우면 발송 자체가 안 나감.
    # Vercel 쪽 설정이 실제로 완료되면 그때 이 schedule을 다시 빼고 넘어가면 됨(둘 다 켜두면
    # 같은 시간대에 두 트리거가 겹쳐서 콘텐츠 큐가 동시에 소진될 위험이 있음).
    - cron: '30 21 * * 0-4'
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능, Vercel Cron도 이걸 호출함

jobs:
  run-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect RSS content
        run: npm run ingest:rss
        continue-on-error: true # 수집 단계가 실패해도 이미 쌓인 콘텐츠로 매칭/발송은 계속 진행

      - name: Prune stale unused news
        run: npm run prune:news
        continue-on-error: true # 정리 실패로 발송 자체가 막히면 안 됨

      - name: Build today's issue
        run: npm run build:issue

      - name: Send digest emails
        run: npm run send:digest
